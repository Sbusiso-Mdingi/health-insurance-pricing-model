# Regenerates the data and models from the R scripts, then checks that the
# dashboard prices every test profile exactly as R does.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Generate the synthetic portfolio
        run: Rscript scripts/synthetic_data_generation.R

      - name: Report whether the data reproduced exactly
        run: git diff --stat -- data

      - name: Fit, compare and validate the models
        run: Rscript scripts/model_training.R

      - name: Run a short coverage study
        run: Rscript scripts/coverage_study.R
        env:
          COVERAGE_REPS: "4"

      - uses: oven-sh/setup-bun@v2

      - name: Parity test and build
        working-directory: dashboard
        run: |
          bun install --frozen-lockfile
          bun test
          bun run build
